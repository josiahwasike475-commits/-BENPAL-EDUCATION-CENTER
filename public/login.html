<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BENPAL EDUCATION CENTRE Staff Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
.benpal-marquee{width:100%;background:#0d47a1;color:#fff;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:12px 0;border-top:3px solid #ffc107;border-bottom:3px solid #ffc107;overflow:hidden;white-space:nowrap;box-sizing:border-box;}.benpal-marquee span{display:inline-block;padding-left:100%;animation:benpal-scroll 18s linear infinite;}.benpal-marquee span b{color:#ffc107;}@keyframes benpal-scroll{from{transform:translateX(0);}to{transform:translateX(-100%);}}.benpal-marquee:hover span{animation-play-state:paused;}
:root{--bg:#f4f6f8;--surf:#fff;--ink:#1b2438;--mute:#5d677c;--line:#d9dee6;--brand:#22345f;--brandtx:#fff;--chalk:#e9b82f;box-sizing:border-box}:root[data-theme="red"]{--bg:#faf2f1;--ink:#2a1517;--mute:#7a5a5c;--line:#e8d2d0;--brand:#8c1c26;--chalk:#f2c14e}:root[data-theme="cream"]{--bg:#f4edda;--surf:#fffaf0;--ink:#2e2616;--mute:#6f6450;--line:#e0d5b8;--brand:#5a4727;--chalk:#d9a441}:root[data-theme="black"]{--bg:#0a0a0a;--surf:#161616;--ink:#ededed;--mute:#9b9b9b;--line:#2d2d2d;--brand:#2b2b2b;--chalk:#f2c14e}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}nav{background:var(--brand);color:var(--brandtx);padding:20px}nav h1{font-size:18px;margin:0 0 4px}nav small{display:block;opacity:.75}.content{display:grid;place-items:center;padding:24px}.card{width:min(100%,430px);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:26px;box-shadow:0 12px 34px #18223b16}h2{margin:0 0 4px;font-size:25px}p{color:var(--mute);margin:0 0 20px}form{display:grid;gap:16px}label{display:grid;gap:7px;font-weight:700}input{width:100%;font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:10px}button{font:inherit;cursor:pointer;border-radius:6px;padding:10px 14px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:700}button:disabled{opacity:.65;cursor:wait}:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}#message{min-height:24px;margin-top:16px;color:#b4381a}.help{font-size:14px;margin-top:16px;margin-bottom:0}.home-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:24px;padding:9px 14px;border:1px solid rgba(255,255,255,.42);border-radius:8px;background:rgba(255,255,255,.12);box-shadow:0 3px 0 rgba(0,0,0,.18);color:var(--brandtx);font-weight:700;text-decoration:none}.home-link:hover{background:var(--chalk);border-color:var(--chalk);color:#1b2438}.home-link:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.18)}.home-link:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}.theme{margin-top:28px;width:auto;height:44px;padding:0 12px;font-size:20px;border-radius:6px;background:var(--chalk);color:#1b2438;border-color:var(--chalk)}@media(max-width:760px){.app{grid-template-columns:1fr}nav{padding:14px 18px}.content{padding:18px}.card{padding:22px}}
</style>
</head>
<body>
<div class="benpal-marquee"><span><b>BENPAL</b> INTEGRATED EDUCATION CENTER • <b>BENPAL</b> INTEGRATED EDUCATION CENTER • <b>BENPAL</b> INTEGRATED EDUCATION CENTER •</span></div>
<div class="app"><nav><h1>BENPAL EDUCATION CENTRE</h1><small>Secure admin console</small><a class="home-link" href="/">Home</a><button class="theme" id="theme" title="Change theme" aria-label="Change theme">Theme</button></nav><main class="content"><section class="card"><h2>Staff sign in</h2><p>Use your individual Benpal staff account.</p><form id="login-form" method="post" action="/api/auth/login"><label>Email<input id="email" type="email" name="email" autocomplete="username" maxlength="254" required></label><label>Password<input id="password" type="password" name="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><button id="submit" type="submit">Sign in</button></form><p id="message" role="status" aria-live="polite"></p><p class="help">Do not share your password. This page is for authorised school staff only.</p></section></main></div>
<script src="/login.js" defer></script>
</body>
</html>
