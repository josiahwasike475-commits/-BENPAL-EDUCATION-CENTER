<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BENPAL EDUCATION CENTRE Admin</title><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"><style>:root{--bg:#f4f6f8;--surf:#fff;--ink:#1b2438;--mute:#5d677c;--line:#d9dee6;--brand:#22345f;--brandtx:#fff;--chalk:#e9b82f;--ok:#1f7a55;--okbg:#dff3ea;--bad:#b4381a;--badbg:#fbe4dd;--warn:#8a5a00;--warnbg:#fff0c9;box-sizing:border-box}:root[data-theme="red"]{--bg:#faf2f1;--ink:#2a1517;--mute:#7a5a5c;--line:#e8d2d0;--brand:#8c1c26;--chalk:#f2c14e}:root[data-theme="cream"]{--bg:#f4edda;--surf:#fffaf0;--ink:#2e2616;--mute:#6f6450;--line:#e0d5b8;--brand:#5a4727;--chalk:#d9a441}:root[data-theme="black"]{--bg:#0a0a0a;--surf:#161616;--ink:#ededed;--mute:#9b9b9b;--line:#2d2d2d;--brand:#2b2b2b;--chalk:#f2c14e;--okbg:#14382b;--badbg:#44211a;--warnbg:#3f3210;--ok:#6fd1a5;--bad:#ff9d85;--warn:#f1c65a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}nav{background:var(--brand);color:var(--brandtx);padding:20px 12px;position:sticky;top:0;height:100vh;align-self:start}nav h1{font-size:18px;margin:0 8px 4px}nav small{display:block;margin:0 8px 20px;opacity:.7}nav button,nav a.home-link{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:10px 12px;border-radius:6px;cursor:pointer}nav a.home-link{text-decoration:none}nav button:hover,nav a.home-link:hover{background:rgba(255,255,255,.1)}nav button[aria-current=true]{background:var(--chalk);color:#1b2438;font-weight:700}.home-link{display:flex!important;align-items:center;min-height:44px;margin:0 0 6px;border:1px solid rgba(255,255,255,.42)!important;background:rgba(255,255,255,.12)!important;box-shadow:0 3px 0 rgba(0,0,0,.18);font-weight:700!important}.home-link:hover{background:var(--chalk)!important;border-color:var(--chalk)!important;color:#1b2438!important}.home-link:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.18)}.home-link:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}main{padding:24px;max-width:1100px;width:100%;min-width:0}h2{margin:0 0 4px;font-size:24px}h3{margin-top:0}p.sub{margin:0 0 18px;color:var(--mute)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}.stat{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:left;color:inherit}.stat b{display:block;font-size:28px;line-height:1.1}.stat span{color:var(--mute);font-size:14px}.panel{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.field{display:grid;gap:4px;font-weight:700;font-size:14px}input,select,button.btn{font:inherit;color:inherit;background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:8px 10px}button.btn{cursor:pointer;background:var(--brand);color:#fff;border-color:var(--brand)}button.btn.alt{background:var(--surf);color:var(--ink);border-color:var(--line)}button.btn.ok{background:var(--ok);border-color:var(--ok)}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:14px;color:var(--mute)}.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:14px;font-weight:700}.t-paid,.t-active,.t-present{background:var(--okbg);color:var(--ok)}.t-owing,.t-absent{background:var(--badbg);color:var(--bad)}.t-partial,.t-late,.t-excused{background:var(--warnbg);color:var(--warn)}.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--ok)}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.note{color:var(--mute)}.empty{padding:12px 0;color:var(--mute)}.notice{margin:0 0 12px;padding:10px 12px;border-radius:6px;background:var(--okbg);color:var(--ok);font-weight:700}.notice.error{background:var(--badbg);color:var(--bad)}@media (max-width:900px){.app{grid-template-columns:180px minmax(0,1fr)}main{padding:18px}}@media (max-width:760px){.app{display:block}.app nav{position:static;top:auto;height:auto;display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:10px}.app nav h1,.app nav small{display:none}.app nav button,.app nav a.home-link{width:auto;margin:0!important}.app main{width:100%;padding:14px}.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.tools>*{min-width:0;max-width:100%}input,select,button.btn{max-width:100%}}@media (max-width:420px){.stats{grid-template-columns:1fr}.app nav{overflow-x:auto;flex-wrap:nowrap}.app nav button,.app nav a.home-link{white-space:nowrap}}</style><style>.benpal-marquee{width:100%;background:rgb(1, 12, 16);color:#fff;font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:12px 0;border-top:3px solid ;border-bottom:3px solid ;overflow:hidden;white-space:nowrap;box-sizing:border-box;}.benpal-marquee span{display:inline-block;padding-left:100%;animation:benpal-scroll 18s linear infinite;}.benpal-marquee span b{color:#ffc107;}@keyframes benpal-scroll{from{transform:translateX(0);}to{transform:translateX(-100%);}}.benpal-marquee:hover span{animation-play-state:paused;}</style></head><body><div class="benpal-marquee"><span><b>BENPAL</b> INTEGRATED EDUCATION CENTER • <b>BENPAL</b> INTEGRATED EDUCATION CENTER • <b>BENPAL</b> INTEGRATED EDUCATION CENTER •</span></div><div class="app"><nav aria-label="Main"><h1>BENPAL EDUCATION CENTRE</h1><small>Admin console</small><a class="home-link" href="/">Home</a><div id="menu"></div><button id="theme" title="Change theme" aria-label="Change theme" style="margin:16px 8px 0;width:auto;background:var(--chalk);color:#1b2438">Theme</button></nav><main id="view" tabindex="-1"></main></div><script src="/admin-part1.js" defer></script><script src="/admin-part2.js" defer></script><script src="/admin-part3.js" defer></script><script src="/admin-part4.js" defer></script><script src="/admin-part5.js" defer></script><script src="/admin-part6.js" defer></script><script src="/admin-part7.js" defer></script></body></html>
