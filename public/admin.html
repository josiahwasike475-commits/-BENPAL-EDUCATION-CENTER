
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BENPAL EDUCATION CENTRE Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--surf:#fff;--ink:#1b2438;--mute:#5d677c;--line:#d9dee6;--brand:#22345f;--brandtx:#fff;--chalk:#e9b82f;--ok:#1f7a55;--okbg:#dff3ea;--bad:#b4381a;--badbg:#fbe4dd;--warn:#8a5a00;--warnbg:#fff0c9;box-sizing:border-box}:root[data-theme="red"]{--bg:#faf2f1;--ink:#2a1517;--mute:#7a5a5c;--line:#e8d2d0;--brand:#8c1c26;--chalk:#f2c14e}:root[data-theme="cream"]{--bg:#f4edda;--surf:#fffaf0;--ink:#2e2616;--mute:#6f6450;--line:#e0d5b8;--brand:#5a4727;--chalk:#d9a441}:root[data-theme="black"]{--bg:#0a0a0a;--surf:#161616;--ink:#ededed;--mute:#9b9b9b;--line:#2d2d2d;--brand:#2b2b2b;--chalk:#f2c14e;--okbg:#14382b;--badbg:#44211a;--warnbg:#3f3210;--ok:#6fd1a5;--bad:#ff9d85;--warn:#f1c65a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}nav{background:var(--brand);color:var(--brandtx);padding:20px 12px;position:sticky;top:0;height:100vh;align-self:start}nav h1{font-size:18px;margin:0 8px 4px}nav small{display:block;margin:0 8px 20px;opacity:.7}nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:10px 12px;border-radius:6px;cursor:pointer}nav button:hover{background:rgba(255,255,255,.1)}nav button[aria-current=true]{background:var(--chalk);color:#1b2438;font-weight:700}main{padding:24px;max-width:1100px;width:100%;min-width:0}h2{margin:0 0 4px;font-size:24px}h3{margin-top:0}p.sub{margin:0 0 18px;color:var(--mute)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}.stat{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:14px;text-align:left;color:inherit}.stat b{display:block;font-size:28px;line-height:1.1}.stat span{color:var(--mute);font-size:14px}.panel{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.field{display:grid;gap:4px;font-weight:700;font-size:14px}input,select,button.btn{font:inherit;color:inherit;background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:8px 10px}button.btn{cursor:pointer;background:var(--brand);color:#fff;border-color:var(--brand)}button.btn.alt{background:var(--surf);color:var(--ink);border-color:var(--line)}button.btn.ok{background:var(--ok);border-color:var(--ok)}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:14px;color:var(--mute)}.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:14px;font-weight:700}.t-paid,.t-active,.t-present{background:var(--okbg);color:var(--ok)}.t-owing,.t-absent{background:var(--badbg);color:var(--bad)}.t-partial,.t-late,.t-excused{background:var(--warnbg);color:var(--warn)}.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--ok)}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.note{color:var(--mute)}.empty{padding:12px 0;color:var(--mute)}.notice{margin:0 0 12px;padding:10px 12px;border-radius:6px;background:var(--okbg);color:var(--ok);font-weight:700}.notice.error{background:var(--badbg);color:var(--bad)}@media (max-width: 900px){.app{grid-template-columns:180px minmax(0,1fr)}main{padding:18px}}@media (max-width: 760px){.app{display:block}.app nav{position:static;top:auto;height:auto;display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:10px}.app nav h1,.app nav small{display:none}.app nav button{width:auto;margin:0!important}.app main{width:100%;padding:14px}.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.tools>*{min-width:0;max-width:100%}input,select,button.btn{max-width:100%}}@media (max-width: 420px){.stats{grid-template-columns:1fr}.app nav{overflow-x:auto;flex-wrap:nowrap}.app nav button{white-space:nowrap}}
</style>
</head>
<body><div class="app"><nav aria-label="Main"><h1>BENPAL EDUCATION CENTRE</h1><small>Admin console</small><div id="menu"></div><button id="theme" title="Change theme" aria-label="Change theme" style="margin:16px 8px 0;width:auto;background:var(--chalk);color:#1b2438">Theme</button></nav><main id="view" tabindex="-1"></main></div>
<script>
const $=s=>document.querySelector(s),KES=n=>new Intl.NumberFormat('en-KE',{style:'currency',currency:'KES',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={user:null,students:[],reportStudents:[],applications:[],attendance:[],staff:[],reports:[],attendanceDate:new Date().toISOString().slice(0,10),view:'overview',search:'',notice:'',paymentOpen:false};
const names={overview:'Overview',students:'Students',attendance:'Attendance',fees:'Fees',staff:'Staff',reports:'Parent reports',library:'Library',admissions:'Admissions'};
const todayText=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const feeTag=s=>s.balance_kes<=0?'<span class="tag t-paid">Paid</span>':s.paid_kes>0?'<span class="tag t-partial">Partial</span>':'<span class="tag t-owing">Owing</span>';
const attendanceTag=status=>status?`<span class="tag t-${esc(status)}">${esc(status)}</span>`:'<span class="note">Not marked</span>';
async function getCsrf(){const r=await fetch('/api/csrf',{credentials:'same-origin'});if(!r.ok)throw new Error('Could not prepare your request. Refresh and try again.');return(await r.json()).csrfToken}
async function load(){try{const[sr,ar,fr,rr,mr]=await Promise.all([fetch('/api/admin/students',{credentials:'same-origin'}),fetch('/api/admin/applications',{credentials:'same-origin'}),fetch('/api/admin/staff',{credentials:'same-origin'}),fetch('/api/admin/parent-reports',{credentials:'same-origin'}),fetch('/api/auth/me',{credentials:'same-origin'})]);if(sr.status===401||ar.status===401||fr.status===401||rr.status===401||mr.status===401){location.href='/login.html';return}const sd=await sr.json(),ad=await ar.json(),fd=await fr.json(),rd=await rr.json(),md=await mr.json();if(!sr.ok)throw new Error(sd.error||'Could not load students.');if(!ar.ok)throw new Error(ad.error||'Could not load admissions.');if(!fr.ok)throw new Error(fd.error||'Could not load staff.');if(!rr.ok)throw new Error(rd.error||'Could not load parent reports.');if(!mr.ok)throw new Error(md.error||'Could not load your access.');state.students=sd.students;state.applications=ad.applications;state.staff=fd.staff;state.reports=rd.reports;state.user=md.user;render()}catch(e){$('#view').innerHTML='<h2>Dashboard unavailable</h2><p class="note">'+esc(e.message||'Refresh and try again.')+'</p>'}}
async function loadAttendance(){try{const r=await fetch('/api/admin/attendance?date='+encodeURIComponent(state.attendanceDate),{credentials:'same-origin'});if(r.status===401){location.href='/login.html';return}const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load attendance.');state.attendance=d.attendance;state.attendanceDate=d.attendanceDate;render()}catch(e){state.notice=e.message||'Could not load attendance.';render()}}
function overview(){const s=state.students,owing=s.filter(x=>Number(x.balance_kes)>0),balance=owing.reduce((a,x)=>a+Number(x.balance_kes),0),canRecordPayment=['school_admin','finance_officer'].includes(state.user?.role),active=s.filter(x=>x.status==='active'),paymentForm=state.paymentOpen?`<form id="payment-form" class="panel"><h3>Record verified fee payment</h3><p class="note">Use the receipt, M-Pesa message or bank record. The reference can only be saved once.</p><div class="tools"><label class="field" style="width:100%">Student<select id="payment-student" required>${active.map(x=>`<option value="${x.id}">${esc(x.full_name)} (${esc(x.student_number)})</option>`).join('')}</select></label><label class="field" style="width:100%">Amount (KES)<input id="payment-amount" required type="number" min="1" max="10000000" step="1" inputmode="numeric"></label><label class="field" style="width:100%">Payment method<select id="payment-method"><option value="mpesa">M-Pesa</option><option value="bank">Bank</option><option value="cash">Cash</option><option value="other">Other</option></select></label><label class="field" style="width:100%">Payment reference<input id="payment-reference" required minlength="3" maxlength="100" placeholder="Receipt or transaction reference"></label><label class="field" style="width:100%">Paid at<input id="payment-paid-at" required type="datetime-local" value="${new Date().toISOString().slice(0,16)}"></label></div><button class="btn ok" type="submit">Save verified payment</button> <button class="btn alt" type="button" data-close-payment>Cancel</button></form>`:'';return `<h2>Overview</h2><p class="sub">${todayText}</p>${state.notice?`<p class="notice${state.notice.includes('Could not')||state.notice.includes('already')||state.notice.includes('at least')?' error':''}">${esc(state.notice)}</p>`:''}<div class="stats"><div class="stat"><b>${s.filter(x=>x.status==='active').length}</b><span>Students in school</span></div><div class="stat"><b>Open Attendance</b><span>Mark today in Attendance</span></div><div class="stat"><b>${KES(balance)}</b><span>Fees outstanding (${owing.length} students)</span></div><div class="stat"><b>${state.applications.length}</b><span>Pending admissions</span></div></div>${paymentForm}<div class="two"><div class="panel"><h3>Needs follow-up</h3>${owing.length?'<ul>'+owing.slice(0,6).map(s=>`<li>${esc(s.full_name)} has ${KES(s.balance_kes)} outstanding.</li>`).join('')+'</ul>':'<p>No fee balances are currently recorded.</p>'}</div><div class="panel"><h3>Fees</h3><p>Record only payments you have checked against the receipt, M-Pesa message or bank record.</p>${canRecordPayment&&active.length?'<button class="btn ok" data-open-payment>Record fee payment</button>':canRecordPayment?'<p class="note">No active students are available yet.</p>':'<p class="note">Only Finance and School Admin can record verified payments.</p>'}</div></div>`}
function students(){const q=state.search.toLowerCase(),rows=state.students.filter(s=>(s.full_name+s.student_number+s.guardian_name).toLowerCase().includes(q));return `<h2>Students</h2><p class="sub">Approved admissions appear here automatically.</p><div class="tools"><input id="q" type="search" placeholder="Search name, ID or guardian" value="${esc(state.search)}" aria-label="Search students"><button class="btn alt" id="refresh">Refresh</button><button class="btn" data-view="attendance">Mark attendance</button></div><div class="panel tw">${rows.length?`<table><thead><tr><th>Student no.</th><th>Name</th><th>Guardian</th><th>Student status</th><th>Fee balance</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.student_number)}</td><td>${esc(s.full_name)}</td><td>${esc(s.guardian_name)}</td><td><span class="tag t-active">${esc(s.status)}</span></td><td>${KES(s.balance_kes)}</td></tr>`).join('')}</tbody></table>`:'<p class="empty">No students yet. Approve admissions first to make a student record.</p>'}</div>`}
function attendance(){const rows=state.attendance,absent=rows.filter(x=>x.status==='absent').length,marked=rows.filter(x=>x.status).length;return `<h2>Attendance</h2><p class="sub">Select a date, then record the student’s status. You can correct a record by saving a different status.</p>${state.notice?`<p class="notice${state.notice.includes('Could not')?' error':''}">${esc(state.notice)}</p>`:''}<div class="panel"><div class="tools"><label class="field">Attendance date<input id="attendance-date" type="date" value="${esc(state.attendanceDate)}"></label><button class="btn alt" id="load-attendance">Load register</button><span class="note">${marked}/${rows.length} marked, ${absent} absent</span></div><div class="tw">${rows.length?`<table><thead><tr><th>Student no.</th><th>Name</th><th>Current status</th><th>Set status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.student_number)}</td><td>${esc(r.full_name)}</td><td>${attendanceTag(r.status)}</td><td><select data-attendance-status="${r.student_id}" aria-label="Set attendance for ${esc(r.full_name)}"><option value="present" ${r.status==='present'?'selected':''}>Present</option><option value="absent" ${r.status==='absent'?'selected':''}>Absent</option><option value="late" ${r.status==='late'?'selected':''}>Late</option><option value="excused" ${r.status==='excused'?'selected':''}>Excused</option></select></td><td><button class="btn ok" data-save-attendance="${r.student_id}">Save</button></td></tr>`).join('')}</tbody></table>`:'<p class="empty">No active students yet. Approve an admission first, then reload this register.</p>'}</div></div>`}
function fees(){const rows=[...state.students].sort((a,b)=>Number(b.balance_kes)-Number(a.balance_kes)),total=rows.reduce((a,s)=>a+Number(s.charged_kes),0),paid=rows.reduce((a,s)=>a+Number(s.paid_kes),0);return `<h2>Fees</h2><p class="sub">Collected ${KES(paid)} of ${KES(total)} (${total?Math.round(paid/total*100):0}%). Only verified payments are included.</p><div class="panel tw">${rows.length?`<table><thead><tr><th>Student</th><th>Billed</th><th>Paid</th><th>Balance</th><th>Progress</th><th>Status</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.full_name)}</td><td>${KES(s.charged_kes)}</td><td>${KES(s.paid_kes)}</td><td><b>${KES(s.balance_kes)}</b></td><td><div class="bar"><i style="width:${s.charged_kes?Math.min(100,Number(s.paid_kes)/Number(s.charged_kes)*100):0}%"></i></div></td><td>${feeTag(s)}</td></tr>`).join('')}</tbody></table>`:'<p class="empty">No students yet. Approve admissions first to track fees.</p>'}</div>`}
function staff(){return `<h2>Staff</h2><p class="sub">Only a school administrator can add staff accounts. Give the temporary password to the staff member privately.</p>${state.notice?`<p class="notice${state.notice.includes('Could not')||state.notice.includes('already')||state.notice.includes('at least')?' error':''}">${esc(state.notice)}</p>`:''}<div class="two"><form id="staff-form" class="panel"><h3>Add staff account</h3><div class="tools"><label class="field" style="width:100%">Full name<input id="staff-name" required maxlength="80" autocomplete="name"></label><label class="field" style="width:100%">School email<input id="staff-email" required type="email" maxlength="254" autocomplete="email"></label><label class="field" style="width:100%">Role<select id="staff-role"><option value="teacher">Teacher</option><option value="admissions_officer">Admissions officer</option><option value="finance_officer">Finance officer</option><option value="school_admin">School administrator</option></select></label><label class="field" style="width:100%">Temporary password<input id="staff-password" required type="password" minlength="12" maxlength="128" autocomplete="new-password"></label></div><p class="note">Use at least 12 characters. It is stored as a secure password hash, not shown again in the system.</p><button class="btn ok" type="submit">Create staff account</button></form><div class="panel"><h3>Access by role</h3><p><b>Teacher:</b> attendance only.</p><p><b>Admissions officer:</b> applications, students and attendance.</p><p><b>Finance officer:</b> student and fee records.</p><p><b>School administrator:</b> staff accounts and school administration.</p></div></div><div class="panel tw"><h3>Staff accounts</h3>${state.staff.length?`<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Created</th></tr></thead><tbody>${state.staff.map(s=>`<tr><td>${esc(s.full_name)}</td><td>${esc(s.email)}</td><td>${esc(s.role.replaceAll('_',' '))}</td><td><span class="tag ${s.is_active?'t-active':'t-absent'}">${s.is_active?'active':'inactive'}</span></td><td>${new Date(s.created_at).toLocaleDateString()}</td></tr>`).join('')}</tbody></table>`:'<p class="empty">No staff accounts found.</p>'}</div>`}
function parentReports(){const active=state.students.filter(s=>s.status==='active');return `<h2>Parent reports</h2><p class="sub">Write a clear report for an active student. Saving the same student and term updates that report.</p>${state.notice?`<p class="notice${state.notice.includes('Could not')||state.notice.includes('at least')?' error':''}">${esc(state.notice)}</p>`:''}<div class="two"><form id="report-form" class="panel"><h3>Create or update report</h3>${active.length?`<div class="tools"><label class="field" style="width:100%">Student<select id="report-student">${active.map(s=>`<option value="${s.id}">${esc(s.full_name)} (${esc(s.student_number)})</option>`).join('')}</select></label><label class="field" style="width:100%">Academic term<input id="report-term" required maxlength="60" placeholder="e.g. Term 1, 2026"></label><label class="field" style="width:100%">Report date<input id="report-date" required type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="field" style="width:100%">Teacher comment<textarea id="report-comment" required minlength="10" maxlength="2000" rows="5" placeholder="Progress, learning and next steps"></textarea></label><label class="field" style="width:100%">Strengths<textarea id="report-strengths" maxlength="1000" rows="3" placeholder="Optional"></textarea></label><label class="field" style="width:100%">Support needed<textarea id="report-support" maxlength="1000" rows="3" placeholder="Optional"></textarea></label></div><button class="btn ok" type="submit">Save parent report</button>`:'<p class="empty">There are no active students yet. Approve an admission first.</p>'}</form><div class="panel"><h3>For parents</h3><p>Use factual, respectful language. Only authorised staff can create reports.</p><p>Reports remain inside the secure school system. Parent login and delivery will be added only after the school’s approval process is ready.</p></div></div><div class="panel tw"><h3>Saved reports</h3>${state.reports.length?`<table><thead><tr><th>Student</th><th>Term</th><th>Date</th><th>Written by</th><th>Comment</th></tr></thead><tbody>${state.reports.map(r=>`<tr><td>${esc(r.full_name)}<br><small>${esc(r.student_number)}</small></td><td>${esc(r.academic_term)}</td><td>${esc(r.report_date)}</td><td>${esc(r.author_name)}</td><td>${esc(r.teacher_comment)}</td></tr>`).join('')}</tbody></table>`:'<p class="empty">No parent reports saved yet.</p>'}</div>`}
function comingSoon(title,body){return `<h2>${title}</h2><p class="sub">${body}</p><div class="panel"><h3>Not connected yet</h3><p>This page uses the BENPAL EDUCATION CENTRE admin design, but its secure database tables and staff permissions are not built yet. It will not use browser-only records or fake school data.</p></div>`}
function admissions(){return `<h2>Admissions</h2><p class="sub">Review pending applications and approve only after the school has checked the details.</p><div class="panel tw">${state.applications.length?`<table><thead><tr><th>Child</th><th>Date of birth</th><th>Applying for</th><th>Guardian</th><th>Phone</th><th>Submitted</th><th></th></tr></thead><tbody>${state.applications.map(a=>`<tr><td>${esc(a.child_name)}</td><td>${esc(a.date_of_birth)}</td><td>${esc(a.applying_for)}</td><td>${esc(a.guardian_name)}</td><td>${esc(a.guardian_phone)}</td><td>${new Date(a.created_at).toLocaleString()}</td><td><button class="btn ok" data-approve="${a.id}">Approve</button></td></tr>`).join('')}</tbody></table>`:'<p class="empty">No pending admissions right now.</p>'}</div>`}
function page(){return{overview,students,attendance,fees,staff,reports:parentReports,library:()=>comingSoon('Library','Book loans and returns will be recorded securely.'),admissions}[state.view]()}
function render(){$('#menu').innerHTML=Object.entries(names).map(([id,label])=>`<button data-view="${id}" aria-current="${id===state.view}">${label}</button>`).join('')+'<button id="signout">Sign out</button>';$('#view').innerHTML=page();}
async function saveAttendance(button){const studentId=button.dataset.saveAttendance,status=$(`[data-attendance-status="${studentId}"]`).value;button.disabled=true;try{const token=await getCsrf(),r=await fetch('/api/admin/attendance',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','x-csrf-token':token},body:JSON.stringify({studentId,attendanceDate:state.attendanceDate,status})});if(!r.ok){const d=await r.json();throw new Error(d.error||'Could not save attendance.')}state.notice='Attendance saved.';await loadAttendance()}catch(e){state.notice=e.message||'Could not save attendance.';button.disabled=false;render()}}
async function createStaff(form){const button=form.querySelector('button[type="submit"]');button.disabled=true;try{const fullName=$('#staff-name').value.trim(),email=$('#staff-email').value.trim(),password=$('#staff-password').value,role=$('#staff-role').value;if(password.length<12)throw new Error('Use a temporary password with at least 12 characters.');const t=await getCsrf(),r=await fetch('/api/admin/staff',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','x-csrf-token':t},body:JSON.stringify({fullName,email,password,role})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not create staff account.');state.notice='Staff account created. Share the temporary password privately.';await load()}catch(e){state.notice=e.message||'Could not create staff account.';button.disabled=false;render()}}
async function saveParentReport(form){const button=form.querySelector('button[type="submit"]');button.disabled=true;try{const body={studentId:$('#report-student').value,academicTerm:$('#report-term').value.trim(),reportDate:$('#report-date').value,teacherComment:$('#report-comment').value.trim(),strengths:$('#report-strengths').value.trim(),supportNeeded:$('#report-support').value.trim()};if(body.teacherComment.length<10)throw new Error('Teacher comment must be at least 10 characters.');const t=await getCsrf(),r=await fetch('/api/admin/parent-reports',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','x-csrf-token':t},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not save parent report.');state.notice='Parent report saved securely.';await load()}catch(e){state.notice=e.message||'Could not save parent report.';button.disabled=false;render()}}
async function saveFeePayment(form){const button=form.querySelector('button[type="submit"]');button.disabled=true;try{const paidAtValue=$('#payment-paid-at').value;if(!paidAtValue)throw new Error('Choose when the payment was made.');const body={studentId:$('#payment-student').value,amountKes:$('#payment-amount').value,paymentMethod:$('#payment-method').value,paymentReference:$('#payment-reference').value.trim(),paidAt:new Date(paidAtValue).toISOString()};if(!/^[1-9]\d*$/.test(body.amountKes))throw new Error('Enter a whole payment amount greater than zero.');if(body.paymentReference.length<3)throw new Error('Enter the receipt or transaction reference.');const t=await getCsrf(),r=await fetch('/api/admin/fee-payments',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','x-csrf-token':t},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not save payment.');state.paymentOpen=false;state.notice='Verified fee payment saved.';await load()}catch(e){state.notice=e.message||'Could not save payment.';button.disabled=false;render()}}
document.addEventListener('submit',e=>{if(e.target.id==='staff-form'){e.preventDefault();createStaff(e.target)}if(e.target.id==='report-form'){e.preventDefault();saveParentReport(e.target)}if(e.target.id==='payment-form'){e.preventDefault();saveFeePayment(e.target)}});document.addEventListener('click',async e=>{const v=e.target.closest('[data-view]');if(v){state.view=v.dataset.view;state.notice='';state.paymentOpen=false;if(state.view==='attendance'){await loadAttendance()}else render();return}if(e.target.matches('[data-open-payment]')){state.paymentOpen=true;state.notice='';render();return}if(e.target.matches('[data-close-payment]')){state.paymentOpen=false;state.notice='';render();return}if(e.target.id==='refresh'){await load();return}if(e.target.id==='load-attendance'){state.attendanceDate=$('#attendance-date').value;state.notice='';await loadAttendance();return}if(e.target.id==='signout'){try{const t=await getCsrf();await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin',headers:{'x-csrf-token':t}})}finally{location.href='/login.html'}return}const a=e.target.closest('[data-save-attendance]');if(a){await saveAttendance(a);return}const b=e.target.closest('[data-approve]');if(!b)return;if(!confirm('Approve this admission? This creates a student record.'))return;b.disabled=true;try{const t=await getCsrf(),r=await fetch('/api/admin/applications/'+b.dataset.approve+'/approve',{method:'POST',credentials:'same-origin',headers:{'x-csrf-token':t}});if(!r.ok){const d=await r.json();throw new Error(d.error||'Approval failed.')}await load()}catch(err){alert(err.message||'Approval failed.');b.disabled=false}});document.addEventListener('input',e=>{if(e.target.id==='q'){state.search=e.target.value;render();const x=$('#q');x.focus();x.setSelectionRange(state.search.length,state.search.length)}});
const themes=['blue','red','cream','black'];let theme=localStorage.getItem('benpal-theme')||'blue';function setTheme(t){theme=t;document.documentElement.dataset.theme=t==='blue'?'':t;localStorage.setItem('benpal-theme',t)}$('#theme').addEventListener('click',()=>setTheme(themes[(themes.indexOf(theme)+1)%themes.length]));setTheme(theme);
// Refresh finance totals after an M-Pesa callback, without interrupting forms or other admin work.
async function refreshFinanceWhenSafe(){if(document.hidden||state.paymentOpen||!['overview','fees'].includes(state.view))return;await load()}
document.addEventListener('visibilitychange',refreshFinanceWhenSafe);
setInterval(()=>{refreshFinanceWhenSafe().catch(()=>{})},30000);
load();
</script></body></html>
